{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Password reset{% endblock %}
{% block content %}
<div><h1>Parolni tiklash</h1>
<p>Emailingizni kiriting. Reset link shu emailga yuboriladi (dev: terminalda chiqadi).</p>
<form method="post">
{% csrf_token %}
{{ form | crispy}}
<button type="submit">Reset link yuborish</button>
</form>
<p><a href="{% url 'login' %}">Login sahifaga qaytish</a></p></div>
{% endblock %}
